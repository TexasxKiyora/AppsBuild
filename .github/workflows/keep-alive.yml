name: Keep Bot Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Keep Alive
        run: |
          echo "✅ Bot keep alive ping at $(date)"
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getMe" || true
