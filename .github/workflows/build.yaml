name: Build Flutter APK

on:
workflow_dispatch:
inputs:
zip_url:
description: URL download ZIP project Flutter
required: true
tag:
description: Tag build
required: true
build_type:
description: debug / release
required: true
default: release
only_analyze:
description: Hanya jalankan analyze (true/false)
required: false
default: false

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 30
steps:
  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Download ZIP project
    run: |
      echo "Downloading ZIP from: ${{ github.event.inputs.zip_url }}"
      curl -L -o project.zip "${{ github.event.inputs.zip_url }}" --fail
      if [ ! -s project.zip ]; then
        echo "File ZIP kosong atau gagal download"
        exit 1
      fi
      file project.zip | grep -i zip || {
        echo "Bukan file ZIP valid"
        cat project.zip | head -c 200
        exit 1
      }

  - name: Extract ZIP
    run: |
      unzip -q project.zip -d project_raw
      SUB_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
      FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
      if [ "$SUB_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
        PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
      else
        PROJECT_DIR="project_raw"
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      echo "Project root: $PROJECT_DIR"

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: 3.24.5
      channel: stable
      cache: true

  - name: Analyze Project Code
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      echo "[RESULT_ANALYZE]"
      if [ -f "pubspec.yaml" ]; then
        flutter analyze 2>&1 || echo "Analyze selesai dengan warning"
      else
        echo "Project bukan Flutter (pubspec.yaml tidak ditemukan) - skip analyze"
      fi
      echo "[END_RESULT_ANALYZE]"

  - name: Stop if Analyze Only
    if: ${{ github.event.inputs.only_analyze == 'true' }}
    run: |
      echo "Mode analyze-only aktif. Workflow dihentikan."
      exit 0

  - name: Flutter Doctor
    run: flutter doctor

  - name: Get dependencies
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      if [ -f "pubspec.yaml" ]; then
        flutter pub get || echo "Pub get gagal, lanjutkan dengan resiko"
      else
        echo "Bukan project Flutter, skip pub get"
      fi

  - name: Build APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      BUILD_TYPE="${{ github.event.inputs.build_type }}"
      if [ "$BUILD_TYPE" != "debug" ] && [ "$BUILD_TYPE" != "release" ]; then
        echo "ERROR: build_type harus debug atau release"
        exit 1
      fi

      if [ -f "pubspec.yaml" ]; then
        flutter build apk --$BUILD_TYPE
      else
        GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLE_PATH" ]; then
          echo "ERROR: Tidak ditemukan gradlew untuk project native"
          exit 1
        fi
        GRADLE_DIR=$(dirname "$GRADLE_PATH")
        cd "$GRADLE_DIR"
        chmod +x gradlew
        if [ "$BUILD_TYPE" = "debug" ]; then
          ./gradlew assembleDebug
        else
          ./gradlew assembleRelease
        fi
      fi

  - name: Locate APK
    run: |
      APK_PATH=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
      if [ -z "$APK_PATH" ]; then
        echo "ERROR: Tidak ditemukan file APK hasil build"
        exit 1
      fi
      echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
      echo "APK ditemukan: $APK_PATH"
      ls -lh "$APK_PATH"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: apk-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
      path: ${{ env.APK_PATH }}
      retention-days: 1
      if-no-files-found: error
