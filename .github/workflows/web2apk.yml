name: 🌐 Web2APK Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL Icon'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install PWA2APK
        run: npm install -g pwa2apk
        
      - name: Build APK
        run: |
          pwa2apk "${{ inputs.web_url }}" \
            --name "${{ inputs.app_name }}" \
            --icon "${{ inputs.icon_url }}" \
            --output ./app.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-build-${{ inputs.app_name }}
          path: ./app.apk
          retention-days: 7
