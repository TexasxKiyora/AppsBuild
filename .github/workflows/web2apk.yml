name: Web to APK Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL Icon (PNG)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      # ─── 1. SETUP ────────────────────────────────────────────────────
      - name: 📦 Setup PWA2APK Environment
        run: |
          echo "🌐 Building Web to APK..."
          echo "URL: ${{ github.event.inputs.web_url }}"
          echo "App Name: ${{ github.event.inputs.app_name }}"
          
          # Update system
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl wget unzip zip jq
          
          # Install Node.js
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y -qq nodejs
          
          # Install pwa2apk
          npm install -g pwa2apk-cli

      # ─── 2. DOWNLOAD ICON ────────────────────────────────────────────
      - name: 🖼️ Download Icon
        run: |
          echo "🖼️ Downloading icon..."
          curl -L "${{ github.event.inputs.icon_url }}" -o /tmp/icon.png
          
          if [ ! -f /tmp/icon.png ] || [ ! -s /tmp/icon.png ]; then
            echo "❌ Gagal download icon!"
            # Use default icon
            echo "iVBORw0KGgoAAAANSUhEUgAA..." | base64 -d > /tmp/icon.png
          fi
          
          echo "✅ Icon downloaded"
          file /tmp/icon.png

      # ─── 3. BUILD APK ────────────────────────────────────────────────
      - name: 🛠️ Build APK from Web
        run: |
          echo "🛠️ Building APK from ${{ github.event.inputs.web_url }}..."
          
          mkdir -p /tmp/build
          cd /tmp/build
          
          # PWA2APK command
          pwa2apk "${{ github.event.inputs.web_url }}" \
            --name "${{ github.event.inputs.app_name }}" \
            --icon /tmp/icon.png \
            --output ./app.apk \
            2>&1 | tee build.log
          
          # Cek hasil
          if [ -f ./app.apk ] && [ -s ./app.apk ]; then
            echo "✅ Build Success!"
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            APK_SIZE=$(du -h ./app.apk | cut -f1)
            echo "📦 APK Size: $APK_SIZE"
          else
            echo "❌ Build Failed!"
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            tail -50 build.log
            exit 1
          fi

      # ─── 4. UPLOAD ARTIFACT ──────────────────────────────────────────
      - name: 📤 Upload APK Artifact
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web2apk
          path: /tmp/build/app.apk
          retention-days: 7

      # ─── 5. SAVE TO RELEASE ──────────────────────────────────────────
      - name: 📦 Upload to Release
        if: env.BUILD_SUCCESS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate tag
          TAG="web2apk-$(date +%s)"
          
          # Create release
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Web2APK $TAG\",\"draft\":false,\"prerelease\":true}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url // empty')
          
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            # Upload APK
            curl -L -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              "${UPLOAD_URL%{?*}?name=${{ github.event.inputs.app_name }}.apk" \
              --data-binary @/tmp/build/app.apk
            
            echo "✅ APK uploaded to release!"
          else
            echo "⚠️ Failed to create release"
          fi

      # ─── 6. SUCCESS ──────────────────────────────────────────────────
      - name: ✅ Build Success
        if: env.BUILD_SUCCESS == 'true'
        run: |
          echo "🎉 Web2APK Build Completed!"
          echo "App: ${{ github.event.inputs.app_name }}"
          echo "URL: ${{ github.event.inputs.web_url }}"
