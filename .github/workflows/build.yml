name: 🚀 Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: '📦 URL ZIP file dari GitHub Release'
        required: true
        type: string
      tag:
        description: '🏷️ Tag release'
        required: true
        type: string
      build_type:
        description: '🔧 Mode Build'
        required: true
        type: choice
        options:
          - release
          - debug
        default: 'release'

jobs:
  build:
    name: 🏗️ Building APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # ==================== STEP 1: BERSIHIN WORKSPACE ====================
      - name: 🧹 Clean Workspace
        run: |
          echo "🧹 Membersihkan workspace..."
          sudo rm -rf $GITHUB_WORKSPACE/*
          sudo rm -rf $GITHUB_WORKSPACE/.[!.]*
          sudo rm -rf /home/runner/.gradle/caches/
          sudo rm -rf /home/runner/.pub-cache/
          echo "✅ Workspace bersih!"

      # ==================== STEP 2: CHECKOUT ====================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== STEP 3: SETUP JAVA ====================
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ==================== STEP 4: SETUP ANDROID SDK ====================
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # ==================== STEP 5: SETUP FLUTTER ====================
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      # ==================== STEP 6: DOWNLOAD ZIP ====================
      - name: 📥 Download ZIP dari Release
        run: |
          mkdir -p workspace
          cd workspace
          echo "📥 Mendownload ZIP dari: ${{ github.event.inputs.zip_url }}"
          wget -q --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -O project.zip "${{ github.event.inputs.zip_url }}"
          echo "✅ ZIP berhasil diunduh!"
          ls -la

      # ==================== STEP 7: EKSTRAK ZIP ====================
      - name: 📂 Extract Project
        run: |
          cd workspace
          echo "📂 Mengekstrak project..."
          unzip -q project.zip -d extracted/
          
          # Cari pubspec.yaml
          PUBSPEC=$(find extracted -name "pubspec.yaml" -type f | head -1)
          
          if [ -z "$PUBSPEC" ]; then
            echo "❌ ERROR: pubspec.yaml tidak ditemukan!"
            echo "📁 Struktur folder:"
            find extracted -type f | head -20
            exit 1
          fi
          
          echo "✅ Ditemukan pubspec.yaml di: $PUBSPEC"
          
          # Pindahin ke root workspace
          PUBSPEC_DIR=$(dirname "$PUBSPEC")
          mv $PUBSPEC_DIR/* ./ 2>/dev/null || true
          
          echo "📁 Isi folder setelah ekstrak:"
          ls -la
          echo "✅ Ekstraksi selesai!"

      # ==================== STEP 8: FLUTTER DEPENDENCIES ====================
      - name: 🔧 Flutter Clean & Get
        run: |
          cd workspace
          echo "🧹 Membersihkan cache Flutter..."
          flutter clean || true
          rm -rf .dart_tool/ .packages pubspec.lock
          
          echo "📦 Menginstall dependencies..."
          flutter pub get
          
          echo "✅ Dependencies siap!"
          
          # Cek ada error di pubspec
          if [ $? -ne 0 ]; then
            echo "❌ Gagal install dependencies!"
            exit 1
          fi

      # ==================== STEP 9: BUILD APK ====================
      - name: 🏗️ Build APK
        id: build
        run: |
          cd workspace
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "🔧 Building Debug APK..."
            flutter build apk --debug
          else
            echo "🔧 Building Release APK..."
            flutter build apk --release
          fi
          
          echo "✅ Build selesai!"
          
          # Cari APK yang dihasilkan
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK tidak ditemukan!"
            echo "📁 Cek struktur:"
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Folder build tidak ditemukan"
            exit 1
          fi
          
          echo "✅ APK ditemukan: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      # ==================== STEP 10: UPLOAD ARTIFACT ====================
      - name: 📤 Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}
          path: workspace/${{ steps.build.outputs.apk_path }}
          retention-days: 7

      # ==================== STEP 11: UPLOAD KE RELEASE ====================
      - name: 📤 Upload APK ke Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          APK_PATH="${{ steps.build.outputs.apk_path }}"
          APK_NAME=$(basename "$APK_PATH")
          
          echo "📤 Uploading $APK_NAME ke release..."
          
          # Ambil release ID dari tag
          RELEASE_RESPONSE=$(curl -s -X GET \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }}")
          
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
          
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ Gagal ambil release ID"
            exit 1
          fi
          
          echo "✅ Release ID: $RELEASE_ID"
          
          # Upload APK
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$APK_NAME"
          
          echo "✅ APK berhasil diupload!"

      # ==================== STEP 12: HASIL AKHIR ====================
      - name: ✅ Build Success
        if: success()
        run: |
          echo "[RESULT_ANALYZE]"
          echo "✅✅✅ BUILD SUKSES 100% ✅✅✅"
          echo "APK telah diupload ke Artifact dan Release"
          echo "[END_RESULT_ANALYZE]"

      - name: ❌ Build Failed
        if: failure()
        run: |
          echo "[RESULT_ANALYZE]"
          echo "❌❌❌ BUILD GAGAL ❌❌❌"
          echo "Cek log di atas untuk detail error"
          echo "[END_RESULT_ANALYZE]"
          exit 1
