name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Flutter project ZIP URL'
        required: true
      tag:
        description: 'Build tag'
        required: true
      build_type:
        description: 'release or debug'
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Project
        run: |
          wget -O project.zip "${{ inputs.zip_url }}"
          unzip project.zip -d app

      - name: Get Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build APK
        run: |
          cd app
          flutter build apk --${{ inputs.build_type }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/*.apk
