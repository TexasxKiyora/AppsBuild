name: Build Flutter APK (zip path OR url)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID job dari Telegram"
        required: true
      zip_url:
        description: "Direct URL zip"
        required: true
      tag:
        description: "Build tag"
        required: true
      build_type:
        description: "release or debug"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare workspace
        run: |
          set -e
          mkdir -p work
          cd work

          echo "MODE: zip_url"
          curl -L --fail --retry 3 --retry-delay 2 "${{ inputs.zip_url }}" -o project.zip

          unzip -q project.zip -d project

      - name: Flutter pub get
        working-directory: work/project
        run: flutter pub get

      - name: Build APK
        working-directory: work/project
        run: flutter build apk --${{ inputs.build_type }} --no-tree-shake-icons

      - name: Collect outputs
        run: |
          mkdir -p out
          cp work/project/build/app/outputs/flutter-apk/*.apk "out/app-${{ inputs.job_id }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: out/*.apk
          retention-days: 7
