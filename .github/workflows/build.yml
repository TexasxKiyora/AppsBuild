name: 🔥 Build Flutter APK (COMPATIBLE - V3.19.6)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Build tag'
        required: true
        type: string
      build_type:
        description: 'release or debug'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥 PAKE FLUTTER 3.19.6 (SAMA KAYAK BOT ORANG)
      - name: 🐦 Setup Flutter (3.19.6)
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: 📦 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 📥 Download Project
        run: |
          mkdir -p app && cd app
          echo "⬇️ Downloading from ${{ inputs.zip_url }}"
          
          curl -L --fail -o project.zip "${{ inputs.zip_url }}"
          
          if file project.zip | grep -q "Zip archive"; then
            unzip -q project.zip && rm project.zip
            echo "✅ Extract berhasil!"
          else
            echo "❌ BUKAN ZIP!" && exit 1
          fi

      - name: 📦 Dependencies & Build
        run: |
          cd app
          flutter pub get
          flutter build apk --${{ inputs.build_type }} \
            --no-tree-shake-icons \
            --dart-define=BUILD_TAG=${{ inputs.tag }}

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-${{ inputs.tag }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
