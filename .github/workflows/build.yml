name: Build Flutter APK (Full Auto Release)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build (contoh: v1.0.0)"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

permissions:
  contents: write # Dibutuhkan untuk membuat Release dan Tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      # =========================
      # 1. SETUP DASAR
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # 2. DOWNLOAD & EKSTRAK ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"
          ls -lh project.zip

      - name: Extract ZIP
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            cat project.zip
            exit 1
          fi
          unzip -q project.zip -d project_raw
          
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # 3. SETUP JAVA & FLUTTER
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # =========================
      # 4. ANALYZE CODE
      # =========================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan."
          exit 1

      # =========================
      # 5. DEPENDENCIES & BUILD
      # =========================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            timeout 120s flutter pub get || echo "⚠️ Gagal download package, lanjutkan..."
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Kompilasi via Flutter SDK..."
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            echo "☕ Project Native Android Terdeteksi!"
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File 'gradlew' tidak ditemukan!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
            cd -
          fi

      # =========================
      # 6. SCANNING & METADATA
      # =========================
      - name: Scanning APK & Generate Metadata
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ Error: APK tidak ditemukan setelah build!"
            exit 1
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          
          # Buat file metadata (info build)
          echo "=== Build Metadata ===" > build_info.txt
          echo "Tag       : ${{ github.event.inputs.tag }}" >> build_info.txt
          echo "Type      : ${{ github.event.inputs.build_type }}" >> build_info.txt
          echo "Date      : $(date)" >> build_info.txt
          echo "Size      : $(ls -lh "$APK_FOUND" | awk '{print $5}')" >> build_info.txt
          echo "SHA256    : $(sha256sum "$APK_FOUND" | awk '{print $1}')" >> build_info.txt

      # =========================
      # 7. UPLOAD ARTIFACT (SEMENTARA)
      # =========================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
            build_info.txt
          retention-days: 1
          if-no-files-found: error

      # =========================
      # 8. AUTO CREATE TAG & RELEASE
      # =========================
      - name: Force Create Tag if Not Exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ github.event.inputs.tag }}"
          git push origin "${{ github.event.inputs.tag }}" --force || echo "Tag push skipped (might be restricted)"

      - name: Upload APK to GitHub Release (FIX)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Release ${{ github.event.inputs.tag }}"
          body_path: build_info.txt
          files: |
            ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ github.event.inputs.build_type == 'debug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 9. CLEANUP
      # =========================
      - name: Cleanup Workspace
        if: always()
        run: |
          rm -rf project_raw project.zip
          echo "🧹 Workspace dibersihkan."
