name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Tag build'
        required: true
        type: string
      build_type:
        description: 'Tipe build (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      # ─── 1. SETUP ──────────────────────────────────────────────────────
      - name: 📦 Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl unzip zip wget jq

      # ─── 2. JDK 17 ────────────────────────────────────────────────────
      - name: ☕ Install JDK 17
        run: |
          sudo apt-get install -y -qq openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      # ─── 3. FLUTTER ──────────────────────────────────────────────────
      - name: 📱 Install Flutter
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=/opt/flutter" >> $GITHUB_ENV

      # ─── 4. ANDROID SDK (PAKE CACHE) ────────────────────────────────
      - name: 🤖 Cache Android SDK
        id: cache-android
        uses: actions/cache@v3
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-34
          restore-keys: android-sdk-${{ runner.os }}-

      - name: 🤖 Install Android SDK
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          
          # Download dengan retry
          for i in {1..5}; do
            echo "Attempt $i..."
            wget -q --timeout=30 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && break
            sleep 3
          done
          
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          mkdir -p cmdline-tools
          mv cmdline-tools latest
          mv latest cmdline-tools/
          
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 🤖 Setup Android SDK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin
          
          # License
          echo "y" | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | grep -v "Warning" || true
          
          # Install platforms
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | grep -v "Warning" || true

      # ─── 5. DOWNLOAD PROJECT ──────────────────────────────────────────
      - name: 📥 Download Project
        run: |
          for i in {1..3}; do
            curl -L --max-time 60 "${{ github.event.inputs.zip_url }}" -o /tmp/project.zip && break
            sleep 3
          done
          
          if [ ! -s /tmp/project.zip ]; then
            echo "❌ Gagal download!"
            exit 1
          fi
          
          unzip -q /tmp/project.zip -d /tmp/project
          rm /tmp/project.zip
          
          PROJECT_DIR=$(find /tmp/project -name "pubspec.yaml" -type f -printf "%h\n" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ─── 6. BUILD ─────────────────────────────────────────────────────
      - name: 🛠️ Build APK
        run: |
          export PATH="/opt/flutter/bin:/opt/android-sdk/cmdline-tools/latest/bin:$PATH"
          export FLUTTER_ROOT=/opt/flutter
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          
          cd $PROJECT_DIR
          flutter clean
          flutter pub get
          
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug 2>&1 | tee build.log
          else
            flutter build apk --release 2>&1 | tee build.log
          fi
          
          if [ -f build/app/outputs/flutter-apk/*.apk ]; then
            echo "✅ Success!"
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "❌ Failed!"
            tail -50 build.log
            exit 1
          fi

      # ─── 7. UPLOAD ────────────────────────────────────────────────────
      - name: 📤 Upload APK
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 📦 Upload to Release
        if: env.BUILD_SUCCESS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $PROJECT_DIR
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          APK_NAME=$(basename "$APK_FILE")
          
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }}" \
            | jq -r '.id // empty')
          
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            curl -L -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$APK_NAME" \
              --data-binary @"$APK_FILE"
            
            curl -L -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"draft":false}' \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi
