name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Build tag'
        required: true
        type: string
      build_type:
        description: 'release or debug'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 📦 Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          
          # Download dan extract cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip
          unzip -q sdk.zip
          rm sdk.zip
          
          # Struktur yang bener: cmdline-tools/latest/
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          rmdir cmdline-tools 2>/dev/null || true
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install platform tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: 📥 Download Project
        run: |
          mkdir -p app
          cd app
          # Download dengan header Authorization kalo pake GitHub API
          if [[ "${{ inputs.zip_url }}" == *"api.github.com"* ]]; then
            curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o project.zip "${{ inputs.zip_url }}"
          else
            wget -q -O project.zip "${{ inputs.zip_url }}"
          fi
          unzip -q project.zip
          rm project.zip

      - name: 📦 Get Dependencies
        run: |
          cd app
          flutter pub get

      - name: 🔨 Build APK
        run: |
          cd app
          flutter build apk --${{ inputs.build_type }} --no-tree-shake-icons

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
