name: Auto Extract ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP files directly
        run: |
          echo "🔍 Mencari file ZIP..."
          
          # Cari semua file ZIP di repository
          find . -maxdepth 3 -name "*.zip" -type f | while read zipfile; do
            echo ""
            echo "📦 Menemukan: $zipfile"
            
            # Cek apakah ZIP valid
            if unzip -t "$zipfile" > /dev/null 2>&1; then
              echo "📂 Mengekstrak langsung ke root repository..."
              
              # Ekstrak langsung ke direktori saat ini (overwrite jika ada)
              unzip -o "$zipfile" -d . 2>&1
              
              echo "✅ Berhasil mengekstrak: $zipfile"
              
              # Hapus file ZIP setelah diekstrak
              echo "🗑️ Menghapus file ZIP: $zipfile"
              rm "$zipfile"
            else
              echo "❌ File ZIP tidak valid: $zipfile"
            fi
          done
          
          echo ""
          echo "🎉 Semua file ZIP berhasil diekstrak!"

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        run: |
          # Cek apakah ada perubahan
          if [[ -z $(git status --porcelain) ]]; then
            echo "✅ Tidak ada perubahan untuk di-commit"
            exit 0
          fi
          
          echo "📝 Menyimpan perubahan..."
          
          # Stage semua perubahan (termasuk file baru dan yang dihapus)
          git add -A
          
          # Commit
          git commit -m "🤖 Auto-extract: Ekstrak file ZIP" || echo "Tidak ada perubahan untuk di-commit"
          
          # Push
          git push origin HEAD:${{ github.ref_name }}
          
          echo "✅ Selesai! File ZIP telah diekstrak dan dihapus."
