name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP file dari GitHub Release'
        required: true
        type: string
      tag:
        description: 'Tag release'
        required: true
        type: string
      build_type:
        description: 'Debug atau Release'
        required: true
        type: choice
        options:
          - debug
          - release
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 🧹 Bersihkan workspace
        run: |
          sudo rm -rf $GITHUB_WORKSPACE/*
          sudo rm -rf $GITHUB_WORKSPACE/.[!.]*
          sudo rm -rf /home/runner/.gradle/caches/
          sudo rm -rf /home/runner/.pub-cache/
          df -h
          echo "✅ Workspace siap"

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: 📥 Download ZIP dari Release
        run: |
          mkdir -p workspace
          cd workspace
          wget -q --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -O project.zip "${{ github.event.inputs.zip_url }}"
          echo "📦 ZIP berhasil diunduh"

      - name: 📂 Extract Project
        run: |
          cd workspace
          unzip -q project.zip -d extracted/
          ls -la extracted/
          
          # Cari pubspec.yaml dan pindahin ke root
          if [ -f "extracted/pubspec.yaml" ]; then
            mv extracted/* ./ 2>/dev/null || true
          elif [ -f "extracted/*/pubspec.yaml" ]; then
            SUBDIR=$(find extracted -name "pubspec.yaml" -printf "%h\n" | head -1)
            mv $SUBDIR/* ./ 2>/dev/null || true
          else
            # Coba cari di subfolder
            find extracted -name "pubspec.yaml" -exec dirname {} \; | while read dir; do
              if [ -f "$dir/pubspec.yaml" ]; then
                echo "📂 Ditemukan pubspec.yaml di: $dir"
                mv $dir/* ./ 2>/dev/null || true
                break
              fi
            done
          fi
          
          ls -la
          echo "📂 Ekstraksi selesai"

      - name: 🔧 Flutter Clean & Get
        run: |
          cd workspace
          flutter clean || true
          rm -rf .dart_tool/ .packages pubspec.lock
          flutter pub get
          echo "✅ Dependencies siap"

      - name: 🏗️ Build APK
        run: |
          cd workspace
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          echo "✅ Build APK selesai"

      - name: 📊 Cek Hasil Build
        id: cek_apk
        run: |
          cd workspace
          
          # Cari APK
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ GAGAL: Tidak ada APK yang dihasilkan!"
            echo "📁 Struktur direktori:"
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "build/app/outputs/flutter-apk/ tidak ditemukan"
            ls -la build/app/outputs/ 2>/dev/null || echo "build/app/outputs/ tidak ditemukan"
            ls -la build/ 2>/dev/null || echo "build/ tidak ditemukan"
            exit 1
          fi
          
          echo "✅ APK ditemukan: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ Hasil build diverifikasi"

      - name: 📤 Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}
          path: workspace/${{ steps.cek_apk.outputs.apk_path }}
          retention-days: 7

      - name: 📤 Upload APK ke Release
        if: steps.cek_apk.outputs.apk_path != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          APK_FILE="${{ steps.cek_apk.outputs.apk_path }}"
          APK_NAME=$(basename "$APK_FILE")
          
          echo "📤 Uploading $APK_NAME ke release ${{ github.event.inputs.tag }}"
          
          # Cari release ID dari tag
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }}" \
            | jq -r '.id')
          
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ Release tidak ditemukan"
            exit 1
          fi
          
          # Upload APK
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Content-Length: $(stat -c%s "$APK_FILE")" \
            --data-binary @"$APK_FILE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$APK_NAME"
          
          echo "✅ APK berhasil diupload ke release"

      - name: 📊 Hasil Analisis Build
        if: failure()
        run: |
          echo "::group::📊 HASIL ANALISIS BUILD"
          echo "❌ BUILD GAGAL - Cek error di atas"
          echo "::endgroup::"
          echo "[RESULT_ANALYZE]"
          echo "❌ Build gagal dengan error"
          echo "Cek log di atas untuk detail"
          echo "[END_RESULT_ANALYZE]"
          exit 1

      - name: ✅ Hasil Analisis Sukses
        if: success()
        run: |
          echo "[RESULT_ANALYZE]"
          echo "✅ BUILD SUKSES!"
          echo "APK telah diupload ke Artifact dan Release"
          echo "[END_RESULT_ANALYZE]"
