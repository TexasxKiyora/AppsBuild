name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project'
        required: true
      tag:
        description: 'Tag release'
        required: true
      build_type:
        description: 'Debug or Release'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 📦 Download ZIP
        run: |
          wget -O project.zip "${{ inputs.zip_url }}"
          unzip project.zip -d project/
          ls -la project/

      - name: 🔧 Setup Project
        working-directory: ./project
        run: |
          flutter pub get
          flutter clean

      - name: 🛠️ Build APK
        working-directory: ./project
        run: |
          if [ "${{ inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: 📤 Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 🧹 Bersih-bersih
        run: rm -rf project/ project.zip
