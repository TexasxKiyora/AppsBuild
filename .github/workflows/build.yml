name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: false
        default: ''
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      package_name:
        description: 'Package Name (com.example.app)'
        required: true
        default: 'com.web2apk.myapp'
      user_id:
        description: 'Telegram User ID'
        required: true
      zip_url:
        description: 'ZIP URL (Flutter project)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download project from ZIP URL
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
          unzip -o project.zip -d ./project
          rm project.zip

      - name: Create project from URL
        if: ${{ github.event.inputs.url != '' && github.event.inputs.zip_url == '' }}
        run: |
          flutter create --project-name "${{ github.event.inputs.app_name }}" --org "com.web2apk" ./project
          echo "package_name=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd project
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-release
          path: project/build/app/outputs/flutter-apk/app-release.apk

      - name: Send to Telegram (success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ github.event.inputs.user_id }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ✅ Build Berhasil!
            📱 Nama: ${{ github.event.inputs.app_name }}
            📦 Package: ${{ github.event.inputs.package_name }}
            🔗 Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send to Telegram (failed)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ github.event.inputs.user_id }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ❌ Build Gagal!
            📱 Nama: ${{ github.event.inputs.app_name }}
            🔍 Cek log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
