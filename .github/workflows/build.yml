name: 🔥 Build Flutter APK (X-FCOLS Edition)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      tag:
        description: 'Build tag'
        required: true
        type: string
      build_type:
        description: 'release or debug'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 📦 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 📥 Download Project
        run: |
          mkdir -p app && cd app
          echo "⬇️ Downloading from ${{ inputs.zip_url }}"
          
          if curl -L --fail -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/octet-stream" \
               -o project.zip "${{ inputs.zip_url }}"; then
            if file project.zip | grep -q "Zip archive"; then
              unzip -q project.zip && rm project.zip
              echo "✅ Extract berhasil!"
            else
              echo "❌ BUKAN ZIP! Isi file:" && head -c 200 project.zip
              exit 1
            fi
          else
            echo "❌ GAGAL DOWNLOAD!" && exit 1
          fi

      # 🔥 FIX: AUTO-DOWNGRADE package_info_plus
      - name: 🔧 Fix package_info_plus compatibility
        run: |
          cd app
          if [ -f "pubspec.yaml" ]; then
            echo "📝 Checking pubspec.yaml..."
            if grep -q "package_info_plus:" pubspec.yaml; then
              echo "🔧 Found package_info_plus, downgrading to 8.0.0..."
              sed -i 's/package_info_plus:.*/package_info_plus: ^8.0.0/' pubspec.yaml
              echo "✅ package_info_plus downgraded to 8.0.0"
            fi
            
            # TAMBAHKAN JUGA FIX UNTUK PLUGIN LAIN YANG SERING ERROR
            if grep -q "share_plus:" pubspec.yaml; then
              sed -i 's/share_plus:.*/share_plus: ^7.0.0/' pubspec.yaml
              echo "✅ share_plus downgraded to 7.0.0"
            fi
            
            if grep -q "device_info_plus:" pubspec.yaml; then
              sed -i 's/device_info_plus:.*/device_info_plus: ^9.0.0/' pubspec.yaml
              echo "✅ device_info_plus downgraded to 9.0.0"
            fi
          fi

      - name: 📦 Dependencies & Build
        run: |
          cd app
          flutter pub get
          flutter build apk --${{ inputs.build_type }} \
            --no-tree-shake-icons \
            --dart-define=BUILD_TAG=${{ inputs.tag }}

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-${{ inputs.tag }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
